name: Cypress Smoke

on:
  push:
    branches:
      - modernize-cypress-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Jigyaasa public smoke tests
        run: npx cypress run --e2e --spec "cypress/integration/smoke/public-site.smoke.js" --browser chrome
        env:
          CYPRESS_BASE_URL: https://www.jigyaasa.info
