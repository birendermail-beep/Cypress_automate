name: Cypress Smoke

on:
  push:
    branches:
      - modernize-cypress-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CYPRESS_BASE_URL: https://www.jigyaasa.info
      CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check suite syntax and imports
        run: npm run check:suite

      - name: Install dependencies
        run: npm install

      - name: Run Jigyaasa public smoke tests
        run: npx cypress run --e2e --spec "cypress/integration/smoke/public-site.smoke.js" --browser chrome

      - name: Run reviewed read-only Admin and Sales reports
        if: ${{ env.CYPRESS_USERNAME != '' && env.CYPRESS_PASSWORD != '' }}
        run: npm run test:reports

      - name: Authenticated test setup reminder
        if: ${{ env.CYPRESS_USERNAME == '' || env.CYPRESS_PASSWORD == '' }}
        run: echo "Authenticated report tests skipped because CYPRESS_USERNAME/CYPRESS_PASSWORD repository secrets are not configured."

      - name: Preserve read-only report failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report-failure-screenshots
          path: cypress/screenshots/reports.js/*.png
          if-no-files-found: ignore
          retention-days: 1
